# Lexico BI-RADS bilingue PT-BR <-> EN.
# Entregavel autonomo do TCC: nao ha trabalho publicado de extracao de DESCRITORES
# BI-RADS granulares em portugues. Versione este arquivo e cite-o.
#
# Cuidados que os dados exigem:
#  - "microcalcificacao" aparece com 36 grafias diferentes em laudos brasileiros
#    (Serapiao et al., Radiologia Brasileira, 2010, 22.247 laudos).
#  - Erros ortograficos consistentes sao comuns em laudos em ingles (ex.:
#    "speculated" em vez de "spiculated", "Heterogenously" em vez de
#    "Heterogeneously" -- documentados em taxonomias de erro tipo ReXErr). Tolere.
#  - Abreviacoes portuguesas de quadrante (QSE, QII, TQS, UQS) nao existem em
#    nenhum lexico pronto.

meta:
  version: "0.1"
  source: "ACR BI-RADS Atlas 5th ed. + RadLex + inspecao do corpus INbreast"

category:
  mass:
    pt: [nodulo, nódulo, nodulos, nódulos, massa, massas, opacidade nodular, imagem nodular]
    en: [mass, mass lesion, nodule, soft tissue opacity, nodular opacity]
    radlex: RID34261
  suspicious_calcification:
    pt: [microcalcificacoes, microcalcificações, microcalcificacao, microcalcificação,
         micro-calcificacoes, micro calcificacoes, calcificacoes suspeitas,
         calcificações suspeitas, calcificacoes agrupadas]
    en: [microcalcification, microcalcifications, suspicious calcification,
         suspicious microcalcifications, calcifications]
  architectural_distortion:
    pt: [distorcao arquitetural, distorção arquitetural, distorcao da arquitetura,
         distorcao do estroma, distorção do estroma, retracao do estroma]
    en: [architectural distortion, distortion, stromal distortion]
  focal_asymmetry:
    pt: [assimetria focal, densidade assimetrica focal]
    en: [focal asymmetry, focal asymmetric density]
  asymmetry:
    pt: [assimetria, densidade assimetrica]
    en: [asymmetry, asymmetric density]
  global_asymmetry:
    pt: [assimetria global, assimetria difusa]
    en: [global asymmetry]
  skin_thickening:
    pt: [espessamento cutaneo, espessamento da pele, espessamento cutâneo]
    en: [skin thickening, thickened skin]
  skin_retraction:
    pt: [retracao cutanea, retração cutânea, retracao da pele]
    en: [skin retraction]
  nipple_retraction:
    pt: [retracao do mamilo, retração do mamilo, mamilo retraido]
    en: [nipple retraction, retracted nipple]
  suspicious_lymph_node:
    pt: [linfonodo suspeito, ganglio suspeito, adenopatia axilar]
    en: [suspicious lymph node, axillary adenopathy, lymphadenopathy]
  postoperative:
    pt: [pos-operatorio, cicatriz cirurgica, tumorectomia, mastectomia, quadrantectomia]
    en: [postoperative, post operative, operative scar, status postoperative, mastectomy]
  no_finding:
    pt: [sem alteracoes, sem achados, exame normal, sem nodulos, sem microcalcificacoes,
         ausencia de nodulos, parenquima sem alteracoes]
    en: [normal breast examination, no mass, no suspicious microcalcifications,
         no speculated mass lesions, no evidence of, unremarkable]

mass_shape:
  round:      {pt: [redondo, redonda, arredondado, arredondada], en: [round]}
  oval:       {pt: [oval, ovalado, ovalada, ovoide], en: [oval, ovoid, round-oval]}
  irregular:  {pt: [irregular, irregulares, contornos irregulares], en: [irregular]}

mass_margin:
  circumscribed: {pt: [circunscrito, circunscrita, bem definido, bem definida,
                       bem delimitado, contornos regulares, contornos nitidos],
                  en: [circumscribed, well defined, well-defined, sharply defined]}
  obscured:      {pt: [obscurecido, obscurecida, parcialmente obscurecido],
                  en: [obscured, partially obscured]}
  microlobulated: {pt: [microlobulado, microlobulada, lobulado], en: [microlobulated, lobulated]}
  indistinct:    {pt: [mal definido, mal definida, indistinto, indistinta,
                       contornos imprecisos, mal delimitado],
                  en: [indistinct, ill defined, ill-defined, poorly defined]}
  spiculated:    {pt: [espiculado, espiculada, espiculas, espículas, com espiculacao,
                       espiculacoes, estrelado],
                  en: [spiculated, speculated, stellate]}   # 'speculated' = erro ortografico real, comum em laudos em ingles

mass_density:
  high:  {pt: [alta densidade, hiperdenso], en: [high density, hyperdense, dense]}
  equal: {pt: [isodenso, densidade semelhante], en: [equal density, isodense, equal]}
  low:   {pt: [baixa densidade, hipodenso], en: [low density, hypodense]}
  fat:   {pt: [conteudo adiposo, densidade de gordura], en: [fat containing, fat density]}

calc_morphology:
  amorphous:            {pt: [amorfas, amorfa], en: [amorphous]}
  coarse_heterogeneous: {pt: [heterogeneas grosseiras], en: [coarse heterogeneous]}
  fine_pleomorphic:     {pt: [pleomorficas, pleomórficas, heterogeneas finas],
                         en: [pleomorphic, fine pleomorphic]}
  fine_linear:          {pt: [lineares finas, lineares ramificadas],
                         en: [fine linear, fine linear branching]}
  punctate:             {pt: [punctiformes, puntiformes], en: [punctate]}
  benign_vascular:      {pt: [vasculares, calcificacoes vasculares], en: [vascular calcifications]}

calc_distribution:
  diffuse:   {pt: [difusas, dispersas], en: [diffuse, scattered]}
  regional:  {pt: [regionais], en: [regional]}
  grouped:   {pt: [agrupadas, em grupamento, agrupamento], en: [grouped, clustered]}
  linear:    {pt: [lineares, em trajeto linear], en: [linear]}
  segmental: {pt: [segmentares], en: [segmental]}

region:
  UOQ: {pt: [quadrante superior externo, QSE, QSL, uniao dos quadrantes superiores, TQS,
             transicao dos quadrantes superiores],
        en: [upper outer quadrant, UOQ, upper outer, upper lateral]}
  UIQ: {pt: [quadrante superior interno, QSI, QII], en: [upper inner quadrant, UIQ, upper inner]}
  LOQ: {pt: [quadrante inferior externo, QIE, QIL], en: [lower outer quadrant, LOQ, lower outer]}
  LIQ: {pt: [quadrante inferior interno, QII], en: [lower inner quadrant, LIQ, lower inner]}
  retroareolar: {pt: [retroareolar, retro-areolar, regiao central, periareolar],
                 en: [retroareolar, central, subareolar, periareolar]}
  axillary: {pt: [axila, axilar, prolongamento axilar], en: [axilla, axillary]}
  upper: {pt: [superior, terco superior], en: [upper, upper part]}
  lower: {pt: [inferior, terco inferior], en: [lower, lower part]}

laterality:
  L: {pt: [mama esquerda, esquerda, a esquerda, à esquerda, esquerdo],
      en: [left breast, left]}
  R: {pt: [mama direita, direita, a direita, à direita, direito],
      en: [right breast, right]}
  B: {pt: [ambas as mamas, bilateral, ambas], en: [both breasts, bilateral]}

density_acr:
  A: {pt: [predominantemente adiposa, quase totalmente adiposa, ACR A],
      en: ["ACR A", almost entirely fatty, predominantly fatty]}
  B: {pt: [densidades fibroglandulares esparsas, fibro adiposa, ACR B],
      en: ["ACR B", scattered fibroglandular, fibro fatty, fibro-fatty]}
  C: {pt: [heterogeneamente densa, ACR C],
      en: ["ACR C", heterogeneously dense, heterogenously dense]}
  D: {pt: [extremamente densa, ACR D], en: ["ACR D", extremely dense]}

negation:
  pt: [sem, ausencia de, ausência de, nao ha, não há, nao se observa, não se observa,
       nao evidencia, sem evidencia de, negativa, negativo, ausentes, nao identificado]
  en: ["no", without, absence of, not seen, no evidence of, negative for, free of, unremarkable]

# Terminadores de escopo de negacao (estilo ConText): a negacao para aqui.
negation_terminators:
  pt: [porem, porém, mas, contudo, entretanto, exceto, salvo, observa-se, nota-se,
       identifica-se, associado a, com]
  en: [but, however, although, except, aside from, apart from, is seen, noted, showing]

# Secoes a DESCARTAR antes de auditar contra imagem de mamografia
discard_sections:
  en: ["CONTRAST ENHANCED SPECTRAL MAMMOGRAPHY", "CONTRAST ENHANCED", "ULTRASOUND", "US REVEALED"]
  pt: ["ecografia", "ultrassonografia", "ultra-sonografia", "microbiopsia", "biopsia",
       "estudo anatomopatologico", "histologico", "marcacao pre-operatoria", "axila"]
